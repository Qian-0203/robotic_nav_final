services:
  yolo-trainer:
    build:
      context: .
      dockerfile: docker/yolo-cuda/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: hw4-yolo-cuda:latest
    container_name: hw4-yolo-cuda
    working_dir: /workspace
    volumes:
      - .:/workspace
    shm_size: "8gb"
    stdin_open: true
    tty: true
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: /bin/bash
