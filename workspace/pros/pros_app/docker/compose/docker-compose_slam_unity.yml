services:
  robot_bringup:
    image: ${PROS_DRIVER_IMAGE:-ghcr.io/screamlab/pros_jetson_driver_image:0.1.0}
    env_file:
      - .env
    volumes:
      - ./demo:/workspace/demo:ro
    networks:
      - my_bridge_network
    command: "ros2 launch /workspace/demo/robot_bringup_unity.xml"

  lidar_tranform:
    image: ${PROS_UNITY_LIDAR_TRANS_IMAGE:-ghcr.io/screamlab/pros_unity_lidar_trans_image:latest}
    env_file:
      - .env
    volumes:
      - ./demo:/workspace/demo:ro
    networks:
      - my_bridge_network
    command: >
      python3 /workspace/demo/unity_scan_relay.py
      --ros-args
      -p input_topic:=/scan_tmp
      -p output_topic:=/scan
      -p output_frame:=laser

  slam:
    image: ${PROS_DRIVER_IMAGE:-ghcr.io/screamlab/pros_jetson_driver_image:0.1.0}
    env_file:
      - .env
    volumes:
      - ./demo:/workspace/demo:ro
    networks:
      - my_bridge_network
    depends_on:
      - robot_bringup
      - lidar_tranform
    command: "ros2 launch /workspace/demo/slam.xml"

  rosbridge:
    image: ${PROS_DRIVER_IMAGE:-ghcr.io/screamlab/pros_jetson_driver_image:0.1.0}
    env_file:
      - .env
    networks:
      - my_bridge_network
    ports:
      - 9090:9090
    command: "ros2 launch rosbridge_server rosbridge_websocket_launch.xml"
  
  foxglove_bridge:
    image: ${FOXGLOVE_BRIDGE_IMAGE:-us-central1-docker.pkg.dev/foxglove-images/images/foxglove_bridge:ros-humble-v3.2.6}
    env_file:
      - .env
    networks:
      - my_bridge_network
    ports:
      - 8765:8765

# This reuses the shared PROS bridge network.
# Create it with: docker network create --driver bridge compose_my_bridge_network
# You can see the network by docker network ls
networks:
  my_bridge_network:
    name: compose_my_bridge_network
    external: true
