services:
  lidar_pkg:
    image: ${PROS_LIDAR_PKG_IMAGE:-registry.screamtrumpet.csie.ncku.edu.tw/alianlbj23/pros_lidar_pkg_image:latest}
    env_file:
      - .env
    networks:
      - my_bridge_network
    command: "ros2 run lidar_pkg lidar_nan_value_filter_node"

# This reuses the shared PROS bridge network.
# Create it with: docker network create --driver bridge compose_my_bridge_network
# You can see the network by docker network ls
networks:
  my_bridge_network:
    name: compose_my_bridge_network
    external: true
