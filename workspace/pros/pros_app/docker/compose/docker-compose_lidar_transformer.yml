services:
  lidar_tranform:
    image: ${PROS_UNITY_LIDAR_TRANS_IMAGE:-ghcr.io/screamlab/pros_unity_lidar_trans_image:latest}
    env_file:
      - .env
    volumes:
      - ./demo:/workspace/demo:ro
    networks:
      - my_bridge_network
    command: >
      python3 /workspace/demo/unity_scan_relay.py
      --ros-args
      -p input_topic:=/scan_tmp
      -p output_topic:=/scan
      -p output_frame:=laser

# This reuses the shared PROS bridge network.
# Create it with: docker network create --driver bridge compose_my_bridge_network
# You can see the network by docker network ls
networks:
  my_bridge_network:
    name: compose_my_bridge_network
    external: true
