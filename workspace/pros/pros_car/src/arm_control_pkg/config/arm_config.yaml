global:
  joints_count: 5.0
  arm_topic: /robot_arm
  imu_receive_topic: /imu/data_raw
  yolo_object_offset_receive_topic: /yolo/object/offset
  angle_step: 5.0  # Amount to increase/decrease angle by with keyboard input
pybullet:
  urdf_name: target.urdf
  gui: false # true or false
  view_world: false # true or false
  initial_height : 0.195
  controllable_joints : 5.0
  end_eff_index: 4.0
  time_step: 1e-3
joints:
  0:
    min_angle: 0.0
    max_angle: 240.0
  1:
    min_angle: 0.0
    max_angle: 240.0
  2:
    min_angle: 0.0
    max_angle: 150.0
  3:
    min_angle: 0.0
    max_angle: 180.0
  4:
    min_angle: 0.0
    max_angle: 70.0
poses:
  # Gripper uses joints 2 and 3: 50.0/50.0 is open, 0.0/0.0 is closed.
  # Joint 4 is not used by the gripper; keep it at 0.0 in named poses.
  initial:
    0: 130.0
    1: 95.0
    2: 50.0
    3: 50.0
    4: 0.0
  grasp:
    0: 130.0
    1: 95.0
    2: 30.0
    3: 30.0
    4: 0.0
  lift:
    0: 70.0
    1: 95.0
    2: 50.0
    3: 50.0
    4: 0.0
  knob_pre_grasp:
    0: 30.0
    1: 150.0
    2: 50.0
    3: 50.0
    4: 0.0
  knob_grasp:
    0: 30.0
    1: 150.0
    2: 10.0
    3: 10.0
    4: 0.0
  knob_unlock:
    0: 90.0
    1: 150.0
    2: 10.0
    3: 10.0
    4: 0.0
joints_reset:
  0: 90.0
  1: 30.0
  2: 30.0
  3: 180.0
  4: 0.0
place_bear:
  pose_publish_count: 5
  pose_publish_period_sec: 0.3
  pose_settle_sec: 1.0
grasp_knob:
  pose_publish_count: 5
  pose_publish_period_sec: 0.25
  pose_settle_sec: 0.5
  down_steps: 1
  forward_distance: 0.08
