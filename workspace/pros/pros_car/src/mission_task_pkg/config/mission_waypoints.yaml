# If use_waypoints is true, missions first publish /goal_pose and run Manual_Nav,
# matching the manual navigation smoke test before YOLO servo takes over.
# Set false to use YOLO search/servo without a fixed navigation waypoint.
use_waypoints: true

mission:
  startup_settle_sec: 3.0

# Published at mission start, matching the manual navigation smoke test.
initial_pose:
  publish: true
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  frame_id: map
  yaw_covariance: 0.0685
  settle_sec: 3.0

# Optional fallback poses. Enable use_waypoints only after tuning these in Unity.
waypoints:
  start:
    x: 0.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  bear_approach:
    x: 0.8
    y: 0.0
    yaw: 0.0
    frame_id: map
  bridge_entry:
    x: 2.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  bridge_exit:
    x: 3.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  knob_approach:
    x: 4.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  door_inside:
    x: 5.0
    y: 0.0
    yaw: 0.0
    frame_id: map

dynamic_approach:
  enabled: true
  detection_timeout_sec: 45.0
  initial_no_detection_forward_sec: 2.0
  fallback_to_waypoint: true
  min_confidence:
    default: 0.0
    bear: 0.9
  standoff_m:
    default: 0.5
    bear: 0.5
    knob: 0.5
    bridge: 1.0
  short_hop:
    default:
      enabled: false
      max_hops: 5
      step_distance_m: 2.0
      goal_tolerance_m: 0.15
      detection_refresh_timeout_sec: 20.0
    bear:
      enabled: true

visual_servo:
  target_depth_m: 0.41
  lateral_tolerance_m: 0.02
  depth_tolerance_m: 0.02
  command_period_sec: 0.2
  rotation_settle_sec: 0.35
  aligned_settle_sec: 3.0
  timeout_sec: 100.0
  search_timeout_sec: 100.0
  bear_candidate_min_confidence: 0.9
  bridge_cross_sec: 4.0
  door_enter_sec: 2.0
