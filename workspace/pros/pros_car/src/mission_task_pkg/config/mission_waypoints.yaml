# If use_waypoints is true, missions first publish /goal_pose and run Manual_Nav,
# matching the manual navigation smoke test before YOLO servo takes over.
# Set false to use YOLO search/servo without a fixed navigation waypoint.
use_waypoints: true

mission:
  startup_settle_sec: 1.0

# Published at mission start, matching the manual navigation smoke test.
initial_pose:
  publish: true
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  frame_id: map
  yaw_covariance: 0.0685
  settle_sec: 1.0

# Optional fallback poses. Enable use_waypoints only after tuning these in Unity.
waypoints:
  start:
    x: -0.15
    y: -0.15
    yaw: 0.0
    frame_id: map
  bear_approach:
    x: 3.0
    y: 1.5
    yaw: 0.0
    frame_id: map
  bridge_direct_approach:
    x: 2.5
    y: 1.5
    yaw: 0.0
    frame_id: map
  bridge_return_midpoint:
    x: 2.0
    y: 1.0
    yaw: 0.0
    frame_id: map
  knob_stage_1:
    x: 3.0
    y: 0.5
    yaw: 0.0
    frame_id: map
  knob_stage_2:
    x: 2.5
    y: 2
    yaw: 0.0
    frame_id: map
  knob_stage_3:
    x: 3.2
    y: 1.2
    yaw: 0.0
    frame_id: map
dynamic_approach:
  enabled: true
  detection_timeout_sec: 25
  amcl_settle_before_detection_sec:
    default: 1.0
    bridge: 1.0
  fallback_to_waypoint: true
  min_confidence:
    default: 0.0
    bear: 0.9
  standoff_m:
    default: 0.5
    bear: 0.4
    knob: 0.5
    bridge: 1.0
  short_hop:
    default:
      enabled: false
      max_hops: 8
      step_distance_m: 1.5
      goal_tolerance_m: 0.1
      detection_refresh_timeout_sec: 5.0
    bear:
      enabled: true
      detection_refresh_timeout_sec: 5.0
    bridge:
      enabled: true
      detection_refresh_timeout_sec: 35.0

visual_servo:
  target_depth_m: 0.39
  lateral_tolerance_m: 0.03
  depth_tolerance_m: 0.01
  command_period_sec: 0.2
  rotation_settle_sec: 0.35
  aligned_settle_sec: 2.0
  timeout_sec: 30.0
  search_timeout_sec: 30.0
  bear_recovery_depth_m: 1.0
  bear_candidate_min_confidence: 0.9
  bridge_climb_sec: 5.0
  bridge_descend_sec: 4.7
  bridge_pre_align_y_offset_m: -0.6
  bridge_yaw_180_turn_sec: 5.0
  bridge_yaw_90_turn_sec: 2.5
  door_enter_sec: 20.0
