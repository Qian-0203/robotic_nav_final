# If use_waypoints is true, missions first publish /goal_pose and run Manual_Nav,
# matching the manual navigation smoke test before YOLO servo takes over.
# Set false to use YOLO search/servo without a fixed navigation waypoint.
use_waypoints: true

# Published at mission start, matching the manual navigation smoke test.
initial_pose:
  publish: true
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  frame_id: map
  yaw_covariance: 0.0685
  settle_sec: 0.5

# Optional fallback poses. Enable use_waypoints only after tuning these in Unity.
waypoints:
  start:
    x: 0.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  bear_approach:
    x: 0.8
    y: 0.0
    yaw: 0.0
    frame_id: map
  bridge_entry:
    x: 2.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  bridge_exit:
    x: 3.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  knob_approach:
    x: 4.0
    y: 0.0
    yaw: 0.0
    frame_id: map
  door_inside:
    x: 5.0
    y: 0.0
    yaw: 0.0
    frame_id: map

visual_servo:
  target_depth_m: 0.45
  lateral_tolerance_m: 0.08
  depth_tolerance_m: 0.08
  timeout_sec: 20.0
  search_timeout_sec: 45.0
  bear_explore_turn_sec: 7.5
  bear_explore_turn_rad: 1.5708
  bear_explore_yaw_tolerance_rad: 0.08
  bear_explore_timeout_sec: 15.0
  bear_explore_settle_sec: 1.0
  bear_candidate_min_confidence: 0.8
  bear_candidate_confidence_weight: 1.0
  bear_candidate_distance_weight: 0.5
  bridge_cross_sec: 4.0
  door_enter_sec: 2.0
